services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: avxxx
      POSTGRES_PASSWORD: avxxx
      POSTGRES_DB: avxxx
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avxxx"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
