services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avxxx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avxxx}
      POSTGRES_DB: ${POSTGRES_DB:-avxxx}
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avxxx"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    # The one image every Go service runs; built once by `docker compose build api`.
    image: avxxx-app:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["/usr/local/bin/api"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://avxxx:avxxx@db:5432/avxxx?sslmode=disable}
      # Listen on all interfaces inside the container so the published port reaches it.
      API_ADDR: 0.0.0.0:8080
      # Empty rejects every /api/admin request.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Web Push: public key only; empty disables the subscribe routes.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
      # Prometheus /metrics: compose network only (no published port).
      METRICS_ADDR: 0.0.0.0:9090
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HASH_KEY: ${LOG_HASH_KEY:-}
      # false = playback mappings come only from the offline media_link job.
      MEDIA_LINK_ON_DEMAND: ${MEDIA_LINK_ON_DEMAND:-true}
      MEDIA_LINK_MIN_INTERVAL: ${MEDIA_LINK_MIN_INTERVAL:-2s}
      MEDIA_RESOLVE_TTL: ${MEDIA_RESOLVE_TTL:-5m}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
  scheduler:
    image: avxxx-app:latest
    pull_policy: never
    command: ["/usr/local/bin/scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://avxxx:avxxx@db:5432/avxxx?sslmode=disable}
      AUDIT_NIGHTLY_AT: ${AUDIT_NIGHTLY_AT:-04:30}
      METRICS_ADDR: 0.0.0.0:9091
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEDIA_LINK_EVERY: ${MEDIA_LINK_EVERY:-1h}
    depends_on:
      db:
        condition: service_healthy
  scraper:
    image: avxxx-app:latest
    pull_policy: never
    command: ["/usr/local/bin/scraper"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://avxxx:avxxx@db:5432/avxxx?sslmode=disable}
      # Contact URL or email in the crawler User-Agent; empty disables catalog crawls.
      CATALOG_CONTACT: ${CATALOG_CONTACT:-}
      CATALOG_USER_AGENT: ${CATALOG_USER_AGENT:-}
      DMM_API_ID: ${DMM_API_ID:-}
      DMM_AFFILIATE_ID: ${DMM_AFFILIATE_ID:-}
      METRICS_ADDR: 0.0.0.0:9092
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
  audit:
    image: avxxx-app:latest
    pull_policy: never
    command: ["/usr/local/bin/audit"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://avxxx:avxxx@db:5432/avxxx?sslmode=disable}
      METRICS_ADDR: 0.0.0.0:9093
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Offline playback linking (media_link job) politeness.
      MEDIA_LINK_MIN_INTERVAL: ${MEDIA_LINK_MIN_INTERVAL:-2s}
      MEDIA_LINK_MAX_PER_RUN: ${MEDIA_LINK_MAX_PER_RUN:-200}
      MEDIA_LINK_DAILY_CAP: ${MEDIA_LINK_DAILY_CAP:-2000}
    depends_on:
      db:
        condition: service_healthy
  notifier:
    image: avxxx-app:latest
    pull_policy: never
    command: ["/usr/local/bin/notifier"]
    # Every channel is disabled while its variables are empty.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://avxxx:avxxx@db:5432/avxxx?sslmode=disable}
      BASE_URL: ${BASE_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NOTIFY_MAX_ATTEMPTS: ${NOTIFY_MAX_ATTEMPTS:-6}
      METRICS_ADDR: 0.0.0.0:9094
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HASH_KEY: ${LOG_HASH_KEY:-}
    depends_on:
      db:
        condition: service_healthy
  # Optional: docker compose --profile monitoring up -d prometheus
  # Scrapes the services' internal metrics listeners over the compose network
  # and evaluates deploy/monitoring/alerts.yml. The UI is bound to localhost
  # only (ssh -L 9095:127.0.0.1:9095 host to reach it).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9095:9090"]
volumes:
  pgdata:
  promdata:
