services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avxxx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avxxx}
      POSTGRES_DB: ${POSTGRES_DB:-avxxx}
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avxxx"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    # The one image every Go service runs; built once by `docker compose build api`.
    image: avxxx-app:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["/usr/local/bin/api"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://avxxx:avxxx@db:5432/avxxx?sslmode=disable}
      # Listen on all interfaces inside the container so the published port reaches it.
      API_ADDR: 0.0.0.0:8080
      # Reverse proxies whose X-Forwarded-For is trusted (CIDRs); empty = TCP peer.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Empty rejects every /api/admin request.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Web Push: public key only; empty disables the subscribe routes.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
      # Google / Apple sign-in (empty = hidden); BASE_URL builds the redirect URI.
      BASE_URL: ${BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # Prometheus /metrics: compose network only (no published port).
      METRICS_ADDR: 0.0.0.0:9090
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HASH_KEY: ${LOG_HASH_KEY:-}
      # false = playback mappings come only from the offline media_link job.
      MEDIA_LINK_ON_DEMAND: ${MEDIA_LINK_ON_DEMAND:-true}
      # false = release-page comments off (routes 404, web hides them).
      COMMENTS_ENABLED: ${COMMENTS_ENABLED:-true}
      MEDIA_LINK_MIN_INTERVAL: ${MEDIA_LINK_MIN_INTERVAL:-2s}
      MEDIA_RESOLVE_TTL: ${MEDIA_RESOLVE_TTL:-5m}
      # Catalog images (internal/images): S3-compatible storage; empty
      # S3_ENDPOINT = no image fields and /api/images/ is 404. With the
      # "storage" profile: S3_ENDPOINT=http://minio:9000.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-avxxx-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      # Public image URLs: proxy (default, /api/images/), a CDN base, or
      # IMAGE_URL_MODE=signed (S3_PRESIGN_ENDPOINT must be browser-reachable).
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      IMAGE_URL_MODE: ${IMAGE_URL_MODE:-proxy}
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-}
      S3_SIGNED_URL_TTL: ${S3_SIGNED_URL_TTL:-12h}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
  # Server-rendered web app (PRD 13 SEO; web/server.mjs). Public traffic goes
  # through the host reverse proxy: /api/* -> api:8080 (127.0.0.1:8080),
  # everything else -> web:3000 (127.0.0.1:3000). See docs/PRODUCTION_OPERATIONS.md.
  web:
    image: avxxx-web:latest
    build:
      context: ./web
    environment:
      # SSR loaders, sitemaps and the optional /api proxy reach the API here.
      API_INTERNAL_URL: http://api:8080
      # Public origin for canonical / hreflang / sitemap URLs (e.g. https://reel.example).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-${BASE_URL:-}}
      # true: the web server also forwards /api/* (single-upstream setups).
      # Prefer routing /api/ to the API in the reverse proxy.
      API_PROXY: ${WEB_API_PROXY:-true}
      SITEMAP_TTL_SECONDS: ${SITEMAP_TTL_SECONDS:-3600}
      LOG_REQUESTS: ${WEB_LOG_REQUESTS:-true}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
  scheduler:
    image: avxxx-app:latest
    pull_policy: never
    command: ["/usr/local/bin/scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://avxxx:avxxx@db:5432/avxxx?sslmode=disable}
      AUDIT_NIGHTLY_AT: ${AUDIT_NIGHTLY_AT:-04:30}
      METRICS_ADDR: 0.0.0.0:9091
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEDIA_LINK_EVERY: ${MEDIA_LINK_EVERY:-1h}
      CROSSCHECK_EVERY: ${CROSSCHECK_EVERY:-1h}
      # Image download / purge job slots (run by audit).
      MEDIA_FETCH_EVERY: ${MEDIA_FETCH_EVERY:-1h}
      MEDIA_PURGE_EVERY: ${MEDIA_PURGE_EVERY:-1h}
    depends_on:
      db:
        condition: service_healthy
  scraper:
    image: avxxx-app:latest
    pull_policy: never
    command: ["/usr/local/bin/scraper"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://avxxx:avxxx@db:5432/avxxx?sslmode=disable}
      # Contact URL or email in the crawler User-Agent; empty disables catalog crawls.
      CATALOG_CONTACT: ${CATALOG_CONTACT:-}
      CATALOG_USER_AGENT: ${CATALOG_USER_AGENT:-}
      DMM_API_ID: ${DMM_API_ID:-}
      DMM_AFFILIATE_ID: ${DMM_AFFILIATE_ID:-}
      THEPORNDB_API_TOKEN: ${THEPORNDB_API_TOKEN:-}
      METRICS_ADDR: 0.0.0.0:9092
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
  audit:
    image: avxxx-app:latest
    pull_policy: never
    command: ["/usr/local/bin/audit"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://avxxx:avxxx@db:5432/avxxx?sslmode=disable}
      METRICS_ADDR: 0.0.0.0:9093
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Offline playback linking (media_link job) politeness.
      MEDIA_LINK_MIN_INTERVAL: ${MEDIA_LINK_MIN_INTERVAL:-2s}
      MEDIA_LINK_MAX_PER_RUN: ${MEDIA_LINK_MAX_PER_RUN:-200}
      MEDIA_LINK_DAILY_CAP: ${MEDIA_LINK_DAILY_CAP:-2000}
      # Third-party cross-check (crosscheck job): crawler contact and token.
      CATALOG_CONTACT: ${CATALOG_CONTACT:-}
      CATALOG_USER_AGENT: ${CATALOG_USER_AGENT:-}
      THEPORNDB_API_TOKEN: ${THEPORNDB_API_TOKEN:-}
      CROSSCHECK_MAX_PER_RUN: ${CROSSCHECK_MAX_PER_RUN:-100}
      CROSSCHECK_DAILY_CAP: ${CROSSCHECK_DAILY_CAP:-1000}
      # Image jobs (media_fetch / media_purge): CATALOG_CONTACT above is
      # the crawler contact (empty = no downloads); limits and retention window.
      IMAGE_FETCH_MIN_INTERVAL: ${IMAGE_FETCH_MIN_INTERVAL:-2s}
      IMAGE_FETCH_MAX_PER_RUN: ${IMAGE_FETCH_MAX_PER_RUN:-200}
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-8388608}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-1600}
      MEDIA_PURGE_AFTER: ${MEDIA_PURGE_AFTER:-24h}
      # Catalog images (internal/images): S3-compatible storage; empty
      # S3_ENDPOINT = no image fields and /api/images/ is 404. With the
      # "storage" profile: S3_ENDPOINT=http://minio:9000.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-avxxx-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
    depends_on:
      db:
        condition: service_healthy
  notifier:
    image: avxxx-app:latest
    pull_policy: never
    command: ["/usr/local/bin/notifier"]
    # Every channel is disabled while its variables are empty.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://avxxx:avxxx@db:5432/avxxx?sslmode=disable}
      BASE_URL: ${BASE_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NOTIFY_MAX_ATTEMPTS: ${NOTIFY_MAX_ATTEMPTS:-6}
      METRICS_ADDR: 0.0.0.0:9094
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HASH_KEY: ${LOG_HASH_KEY:-}
    depends_on:
      db:
        condition: service_healthy
  # Optional: docker compose --profile storage up -d minio
  # S3-compatible object storage for catalog images (docs/IMAGE_STORAGE.md).
  # Private: no published port, no bucket policy; api and audit reach it on
  # the compose network (S3_ENDPOINT=http://minio:9000) and the audit worker
  # creates the bucket. Root credentials are S3_ACCESS_KEY / S3_SECRET_KEY
  # (MinIO refuses to start while they are empty or the secret is < 8
  # chars). MinIO no longer publishes images to Docker Hub for every
  # release; set MINIO_IMAGE to a mirror you trust when the default cannot
  # be pulled. Any other S3 provider works with the same S3_* variables.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    profiles: ["storage"]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
      MINIO_BROWSER: "off"
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
  # Optional: docker compose --profile monitoring up -d prometheus
  # Scrapes the services' internal metrics listeners over the compose network
  # and evaluates deploy/monitoring/alerts.yml. The UI is bound to localhost
  # only (ssh -L 9095:127.0.0.1:9095 host to reach it).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9095:9090"]
  # Optional: routes Prometheus alerts to the on-call receivers
  # (docker compose --profile monitoring up -d alertmanager). The config is
  # rendered at start-up from the ALERT_* / SMTP_* variables by
  # deploy/monitoring/alertmanager/render-config.sh; with none set it starts
  # with empty receivers and logs a warning. UI on 127.0.0.1:9096 only.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["monitoring"]
    user: "65534:65534"
    read_only: true
    entrypoint: ["/bin/sh", "/etc/alertmanager/render-config.sh"]
    environment:
      ALERTMANAGER_EXTERNAL_URL: ${ALERTMANAGER_EXTERNAL_URL:-http://127.0.0.1:9096}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WARNING_WEBHOOK_URL: ${ALERT_WARNING_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_WARNING_EMAIL_TO: ${ALERT_WARNING_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - ./deploy/monitoring/alertmanager/render-config.sh:/etc/alertmanager/render-config.sh:ro
      - amdata:/alertmanager
    tmpfs:
      # Rendered config and secret files; never written to disk.
      - /run/alertmanager:uid=65534,gid=65534,mode=0700,size=1m
    ports: ["127.0.0.1:9096:9093"]
  # Optional: host metrics (disk, memory, load) and the backup freshness
  # textfile written by scripts/backup-db.sh. Read-only host mounts; reachable
  # only on the compose network (no published port).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ["monitoring"]
    user: "65534:65534"
    read_only: true
    command:
      - --path.rootfs=/host
      - --path.udev.data=/host/run/udev/data
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|etc|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
      - ${BACKUP_METRICS_DIR:-./backups/metrics}:/textfile:ro
volumes:
  pgdata:
  miniodata:
  promdata:
  amdata:
