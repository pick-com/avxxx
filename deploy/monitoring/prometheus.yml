# Prometheus for the optional `monitoring` compose profile
# (docker compose --profile monitoring up -d prometheus).
#
# Every target is a service-internal metrics listener on the compose network
# (METRICS_ADDR=0.0.0.0:909x inside the container, no published port); nothing
# here is reachable from outside the host. Job names are what alerts.yml
# matches on.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    deployment: avxxx

rule_files:
  - /etc/prometheus/alerts.yml

# Paging needs an Alertmanager (not part of this profile yet); until then the
# firing alerts are listed at /alerts in the Prometheus UI.
scrape_configs:
  - job_name: avxxx-api
    static_configs:
      - targets: ["api:9090"]
  - job_name: avxxx-scheduler
    # Database-derived gauges are cached for 30 s (5 min for play pairing).
    scrape_interval: 30s
    static_configs:
      - targets: ["scheduler:9091"]
  - job_name: avxxx-scraper
    static_configs:
      - targets: ["scraper:9092"]
  - job_name: avxxx-audit
    static_configs:
      - targets: ["audit:9093"]
  - job_name: avxxx-notifier
    static_configs:
      - targets: ["notifier:9094"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
