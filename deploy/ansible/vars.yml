app_name: avxxx
app_dir: /opt/avxxx
deploy_user: avxxx
git_repo: git@github.com:pick-com/avxxx.git
git_branch: main
# Must carry the same password the db container was initialised with
# (POSTGRES_PASSWORD in deploy.yml); use a URL-safe one (openssl rand -hex 32).
database_url: "postgres://avxxx:{{ postgres_password | default('change-me') | urlencode }}@db:5432/avxxx?sslmode=disable"
compose_project: avxxx
# Public origin: canonical / hreflang / sitemap URLs (PUBLIC_BASE_URL) and the
# OAuth redirect URI (BASE_URL, Google client: https://javpick.com/api/auth/oauth/google/callback).
site_domain: javpick.com
base_url: "https://{{ site_domain }}"
public_base_url: "{{ base_url }}"
# Daily pg_dump (scripts/backup-db.sh) via cron; opt in with -e backup_cron_enabled=true.
# Also copy the dumps off this host (docs/PRODUCTION_OPERATIONS.md 备份与恢复).
backup_dir: "{{ app_dir }}/backups"
backup_metrics_dir: "{{ app_dir }}/backups/metrics"
backup_keep_days: 14
backup_cron_hour: 3
backup_cron_minute: 17
# Sender for account mail (password reset, reminders, takedown notices).
# SMTP must be allowed to send for this domain (SPF/DKIM on javpick.com).
mail_from: "noreply@{{ site_domain }}"
