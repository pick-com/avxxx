---
- name: Provision avxxx host
  hosts: avxxx
  become: true
  vars_files: [vars.yml]
  tasks:
    - name: Install deployment packages
      ansible.builtin.package:
        name: [git, docker.io, docker-compose-plugin]
        state: present
    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true
        create_home: true
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0750'
