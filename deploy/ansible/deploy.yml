---
- name: Deploy avxxx
  hosts: avxxx
  become: true
  become_user: "{{ deploy_user }}"
  vars_files: [vars.yml]
  tasks:
    - name: Checkout application
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch }}"
        update: true
        force: true
    - name: Render production environment
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: '0600'
        content: |
          POSTGRES_DB=avxxx
          POSTGRES_USER=avxxx
          POSTGRES_PASSWORD={{ postgres_password | default('change-me') }}
          DATABASE_URL={{ database_url }}
          ADMIN_TOKEN={{ admin_token | default('') }}
          BASE_URL={{ base_url | default('') }}
          VAPID_PUBLIC_KEY={{ vapid_public_key | default('') }}
          VAPID_PRIVATE_KEY={{ vapid_private_key | default('') }}
          VAPID_SUBJECT={{ vapid_subject | default('') }}
          SMTP_HOST={{ smtp_host | default('') }}
          SMTP_PORT={{ smtp_port | default(587) }}
          SMTP_USER={{ smtp_user | default('') }}
          SMTP_PASSWORD={{ smtp_password | default('') }}
          MAIL_FROM={{ mail_from | default('') }}
          CATALOG_CONTACT={{ catalog_contact | default('') }}
          DMM_API_ID={{ dmm_api_id | default('') }}
          DMM_AFFILIATE_ID={{ dmm_affiliate_id | default('') }}
          LOG_HASH_KEY={{ log_hash_key | default('') }}
          PUBLIC_BASE_URL={{ public_base_url | default(base_url | default('')) }}
          WEB_API_PROXY={{ web_api_proxy | default('true') }}
    - name: Build and start database
      ansible.builtin.command:
        cmd: docker compose up -d db
        chdir: "{{ app_dir }}"
    - name: Build API image
      ansible.builtin.command:
        cmd: docker compose build api
        chdir: "{{ app_dir }}"
    - name: Build web (SSR) image
      ansible.builtin.command:
        cmd: docker compose build web
        chdir: "{{ app_dir }}"
    - name: Start application services
      ansible.builtin.command:
        cmd: docker compose up -d api scheduler scraper audit notifier web
        chdir: "{{ app_dir }}"
    - name: Start monitoring (Prometheus + alert rules, localhost-only UI)
      ansible.builtin.command:
        cmd: docker compose --profile monitoring up -d prometheus
        chdir: "{{ app_dir }}"
      when: monitoring_enabled | default(false) | bool
    - name: Check API health
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/health
        status_code: 200
        retries: 12
        delay: 5
    - name: Check web (SSR) health
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/healthz
        status_code: 200
      register: web_health
      retries: 12
      delay: 5
      until: web_health.status == 200
    # 收录健康分 inputs (PRD 11 / 13): sample SSR pages and sitemap coverage,
    # POST the report to /api/admin/seo/report (nightly_runs job seo.check).
    # ADMIN_TOKEN comes from the rendered .env; it is not given to the web service.
    - name: Daily SEO check
      ansible.builtin.cron:
        name: avxxx seo check
        minute: "15"
        hour: "5"
        job: >-
          cd {{ app_dir }} && set -a && . ./.env && set +a &&
          docker compose run --rm --no-deps -e WEB_URL=http://web:3000 -e API_URL=http://api:8080 -e ADMIN_TOKEN
          web node scripts/seo-check.mjs > /dev/null 2>> {{ app_dir }}/seo-check.log
        state: "{{ 'present' if (seo_check_enabled | default(true) | bool) else 'absent' }}"
