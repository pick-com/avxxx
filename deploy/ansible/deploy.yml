---
- name: Deploy avxxx
  hosts: avxxx
  become: true
  become_user: "{{ deploy_user }}"
  vars_files: [vars.yml]
  tasks:
    - name: Checkout application
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch }}"
        update: true
        force: true
    - name: Render production environment
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: '0600'
        content: |
          POSTGRES_DB=avxxx
          POSTGRES_USER=avxxx
          POSTGRES_PASSWORD={{ postgres_password | default('change-me') }}
          DATABASE_URL={{ database_url }}
          ADMIN_TOKEN={{ admin_token | default('') }}
          # Break-glass off once personal admin accounts exist (docs/DEPLOYMENT.md 2.7).
          ADMIN_TOKEN_DISABLED={{ admin_token_disabled | default(false) | bool | lower }}
          ADMIN_TOTP_KEY={{ admin_totp_key | default('') }}
          # Signs the site-entry 18+ gate cookie (api and web share it;
          # internal/api/agegate.go). Empty = the public development key.
          AGE_GATE_KEY={{ age_gate_key | default('') }}
          # Service token (svc_…) of the daily SEO check, scoped to POST /api/admin/seo/report
          # (docs/DEPLOYMENT.md 2.7); empty = the cron falls back to ADMIN_TOKEN.
          SEO_REPORT_TOKEN={{ seo_report_token | default('') }}
          BASE_URL={{ base_url | default('') }}
          VAPID_PUBLIC_KEY={{ vapid_public_key | default('') }}
          VAPID_PRIVATE_KEY={{ vapid_private_key | default('') }}
          VAPID_SUBJECT={{ vapid_subject | default('') }}
          SMTP_HOST={{ smtp_host | default('') }}
          SMTP_PORT={{ smtp_port | default(587) }}
          SMTP_USER={{ smtp_user | default('') }}
          SMTP_PASSWORD={{ smtp_password | default('') }}
          MAIL_FROM={{ mail_from | default('') }}
          # Google / Apple sign-in; empty = buttons hidden.
          GOOGLE_CLIENT_ID={{ google_client_id | default('') }}
          GOOGLE_CLIENT_SECRET={{ google_client_secret | default('') }}
          APPLE_CLIENT_ID={{ apple_client_id | default('') }}
          APPLE_TEAM_ID={{ apple_team_id | default('') }}
          APPLE_KEY_ID={{ apple_key_id | default('') }}
          APPLE_PRIVATE_KEY={{ apple_private_key | default('') }}
          CATALOG_CONTACT={{ catalog_contact | default('') }}
          DMM_API_ID={{ dmm_api_id | default('') }}
          DMM_AFFILIATE_ID={{ dmm_affiliate_id | default('') }}
          THEPORNDB_API_TOKEN={{ theporndb_api_token | default('') }}
          LOG_HASH_KEY={{ log_hash_key | default('') }}
          # Alertmanager receivers (monitoring profile); empty = not configured.
          ALERT_WEBHOOK_URL={{ alert_webhook_url | default('') }}
          ALERT_WARNING_WEBHOOK_URL={{ alert_warning_webhook_url | default('') }}
          ALERT_EMAIL_TO={{ alert_email_to | default('') }}
          ALERT_WARNING_EMAIL_TO={{ alert_warning_email_to | default('') }}
          ALERT_EMAIL_FROM={{ alert_email_from | default('') }}
          ALERT_SLACK_WEBHOOK_URL={{ alert_slack_webhook_url | default('') }}
          ALERT_TELEGRAM_BOT_TOKEN={{ alert_telegram_bot_token | default('') }}
          ALERT_TELEGRAM_CHAT_ID={{ alert_telegram_chat_id | default('') }}
          BACKUP_METRICS_DIR={{ backup_metrics_dir }}
          PUBLIC_BASE_URL={{ public_base_url | default(base_url | default('')) }}
          WEB_API_PROXY={{ web_api_proxy | default('true') }}
          # Resolve cache (api): sliding TTL, and the max age when a stream's expiry is unknown.
          MEDIA_RESOLVE_TTL={{ media_resolve_ttl | default('5m') }}
          MEDIA_RESOLVE_MAX_AGE={{ media_resolve_max_age | default('30m') }}
          # Proxies whose X-Forwarded-For the API trusts; empty = TCP peer only.
          TRUSTED_PROXIES={{ trusted_proxies | default('') }}
          # Country header a trusted proxy / CDN sets besides CF-IPCountry; empty = none.
          GEOIP_HEADER={{ geoip_header | default('') }}
          # Catalog image storage (docs/DATA_RETENTION_AND_IMAGES.md); empty = images off.
          S3_ENDPOINT={{ s3_endpoint | default('') }}
          S3_BUCKET={{ s3_bucket | default('avxxx-media') }}
          S3_ACCESS_KEY={{ s3_access_key | default('') }}
          S3_SECRET_KEY={{ s3_secret_key | default('') }}
          S3_REGION={{ s3_region | default('us-east-1') }}
          S3_PUBLIC_BASE_URL={{ s3_public_base_url | default('') }}
    - name: Build and start database
      ansible.builtin.command:
        cmd: docker compose up -d db
        chdir: "{{ app_dir }}"
    - name: Build API image
      ansible.builtin.command:
        cmd: docker compose build api
        chdir: "{{ app_dir }}"
    - name: Build web (SSR) image
      ansible.builtin.command:
        cmd: docker compose build web
        chdir: "{{ app_dir }}"
    - name: Start object storage (MinIO, compose profile "storage"; private, no published port)
      ansible.builtin.command:
        cmd: docker compose --profile storage up -d minio
        chdir: "{{ app_dir }}"
      when: storage_enabled | default(false) | bool
    - name: Start application services
      ansible.builtin.command:
        cmd: docker compose up -d api scheduler scraper audit notifier web
        chdir: "{{ app_dir }}"
    - name: Create backup directories (dumps private, metrics readable by node-exporter)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ backup_dir }}", mode: '0700'}
        - {path: "{{ backup_metrics_dir }}", mode: '0755'}
      when: (monitoring_enabled | default(false) | bool) or (backup_cron_enabled | default(false) | bool)
    - name: Start monitoring (Prometheus, Alertmanager, node_exporter; localhost-only UIs)
      # --force-recreate picks up changed bind-mounted configs; data volumes are kept.
      ansible.builtin.command:
        cmd: docker compose --profile monitoring up -d --force-recreate prometheus alertmanager node-exporter
        chdir: "{{ app_dir }}"
      when: monitoring_enabled | default(false) | bool
    - name: Schedule the daily database backup
      # pg_dump runs inside the db container (BACKUP_VIA_COMPOSE=1), so the host
      # needs no PostgreSQL client. Output is appended to backup.log next to the
      # dumps. Opt-in; with backup_cron_enabled unset the entry is removed.
      become_user: root  # crontab -u needs root even for the deploy user's own table
      ansible.builtin.cron:
        name: avxxx database backup
        user: "{{ deploy_user }}"
        minute: "{{ backup_cron_minute }}"
        hour: "{{ backup_cron_hour }}"
        job: >-
          cd {{ app_dir }} &&
          BACKUP_VIA_COMPOSE=1 OUTPUT_DIR={{ backup_dir }} BACKUP_KEEP_DAYS={{ backup_keep_days }}
          BACKUP_METRICS_DIR={{ backup_metrics_dir }}
          ./scripts/backup-db.sh >> {{ backup_dir }}/backup.log 2>&1
        state: "{{ 'present' if (backup_cron_enabled | default(false) | bool) else 'absent' }}"
    - name: Check API health
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/health
        status_code: 200
        retries: 12
        delay: 5
    - name: Check web (SSR) health
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/healthz
        status_code: 200
      register: web_health
      retries: 12
      delay: 5
      until: web_health.status == 200
    # 收录健康分 inputs (PRD 11 / 13): sample SSR pages and sitemap coverage,
    # POST the report to /api/admin/seo/report (nightly_runs job seo.check).
    # The report is sent with the SEO_REPORT_TOKEN service token from the
    # rendered .env; only when it is unset is the break-glass ADMIN_TOKEN
    # passed instead. Neither is given to the long-running web service.
    - name: Daily SEO check
      ansible.builtin.cron:
        name: avxxx seo check
        minute: "15"
        hour: "5"
        job: >-
          cd {{ app_dir }} && set -a && . ./.env && set +a &&
          docker compose run --rm --no-deps -e WEB_URL=http://web:3000 -e API_URL=http://api:8080
          {{ '-e SEO_REPORT_TOKEN' if (seo_report_token | default('')) else '-e ADMIN_TOKEN' }}
          web node scripts/seo-check.mjs > /dev/null 2>> {{ app_dir }}/seo-check.log
        state: "{{ 'present' if (seo_check_enabled | default(true) | bool) else 'absent' }}"
