<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHK World · HLS 测试</title>
<style>
body{background:#101821;color:#e6edf4;font:16px system-ui;margin:0;padding:32px}main{max-width:960px;margin:auto}h1{font-size:28px}p{color:#b9c7d4}button{background:#329ddb;color:#fff;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin:0 8px 12px 0}video{width:100%;background:#000;border-radius:12px}input{box-sizing:border-box;width:100%;padding:12px;margin:12px 0;background:#1c2937;color:#fff;border:1px solid #40536a;border-radius:6px}#status{white-space:pre-wrap;padding:16px;background:#1c2937;border-radius:8px}small{color:#aebdca}
</style>
<main><h1>NHK World · HLS 测试</h1><p>读取播放地址，直接在浏览器播放。不会代理视频流。</p>
<button id="kodi">读取 Kodi 地址</button><button id="nhk">获取 NHK 地址</button>
<input id="url" placeholder="HTTPS .m3u8 地址" aria-label="HLS 地址"><button id="play">播放</button><button id="stop">停止</button>
<video id="video" controls playsinline></video><p id="status" role="status">先获取地址，再点击播放。</p>
<small>本机技术测试。Kodi 能播放不代表浏览器支持跨域，也不代表获准在网站转播。</small></main>
<script src="/hls.min.js"></script>
<script>
const video=document.querySelector('#video'),input=document.querySelector('#url'),status=document.querySelector('#status');let hls;
const say=message=>status.textContent=message;
function stop(){if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load()}
async function getAddress(type){say('正在获取地址…');try{const response=await fetch('/api/'+type);const data=await response.json();if(!response.ok)throw Error(data.error);input.value=data.url;say('地址已取得：'+data.source+'。点击播放。')}catch(error){say(error.message)}}
document.querySelector('#kodi').onclick=()=>getAddress('kodi');document.querySelector('#nhk').onclick=()=>getAddress('nhk');
document.querySelector('#stop').onclick=()=>{stop();say('已停止')};
document.querySelector('#play').onclick=()=>{stop();const url=input.value.trim();try{if(new URL(url).protocol!=='https:')throw Error('请输入 HTTPS 播放地址')}catch(error){say(error.message);return}say('正在加载…');if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play().catch(error=>say(error.message))}else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal)say('播放失败：'+data.type+' / '+data.details+'。网络错误请检查地址、CORS 和地区限制。')});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(error=>say(error.message)))}else say('浏览器不支持 HLS，或 hls.js 未加载')};
video.addEventListener('resize',()=>{if(!video.paused)say('正在播放 · '+video.videoWidth+' × '+video.videoHeight)});video.addEventListener('playing',()=>say('正在播放 · '+video.videoWidth+' × '+video.videoHeight));video.addEventListener('error',()=>say('播放失败：浏览器错误 '+video.error?.code));
</script></html>
